services:
  mysql:
    image: mysql:8.4
    container_name: event-hub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: local_event_hub
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Schema is auto-imported the first time the container starts with an empty volume
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro

volumes:
  mysql_data:
